name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant (benchmark = optimized, installable APK with stable app name; debug = debug build)"
        type: choice
        default: benchmark
        options:
          - benchmark
          - debug

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@v4.0.2

      # FlorisBoard v0.5.2 depends on the jetpref snapshot 20251119T222500Z-SNAPSHOT, which was deleted from the
      # snapshot repository. Build the matching jetpref commit (22:24:31 UTC, "Update dependencies") from source.
      - name: Build jetpref snapshot from source
        run: |
          git clone https://github.com/patrickgold/jetpref.git "$RUNNER_TEMP/jetpref"
          cd "$RUNNER_TEMP/jetpref"
          git checkout d6e12dda6517345dacc3682aa476a8448a71c34b
          ./gradlew publishToMavenLocal \
            -PprojectVersion=20251119T222500Z-SNAPSHOT \
            -PRELEASE_SIGNING_ENABLED=false \
            -PmavenCentralPublishing=false \
            --no-daemon --stacktrace

      # Fixed signing key so every new APK installs over the previous one.
      # A repository secret DEBUG_KEYSTORE_BASE64 takes priority; otherwise signing/debug.keystore from the repo is used.
      - name: Restore signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Using signing key from secret."
          else
            cp signing/debug.keystore ~/.android/debug.keystore
            echo "Using signing key from signing/debug.keystore."
          fi

      - name: Build with Gradle
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          TASK="assemble$(echo "${VARIANT:0:1}" | tr '[:lower:]' '[:upper:]')${VARIANT:1}"
          ./gradlew clean ":app:${TASK}"

      - name: Rename APK
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/${VARIANT}/*.apk "dist/florisboard-plus-${VARIANT}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: florisboard-plus-${{ inputs.variant }}-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ inputs.variant }}
        run: |
          TAG="plus-${VARIANT}-${{ github.run_number }}"
          gh release create "$TAG" "dist/florisboard-plus-${VARIANT}.apk" \
            --target "${{ github.sha }}" \
            --title "FlorisBoard Plus #${{ github.run_number }} (${VARIANT})" \
            --notes "Automatic build of commit ${{ github.sha }}."
