name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant (benchmark = optimized, installable APK with stable app name; debug = debug build)"
        type: choice
        default: benchmark
        options:
          - benchmark
          - debug

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@v4.0.2

      # Optional: keep the same signing key between builds so new APKs can be installed over old ones.
      # Add a repository secret named DEBUG_KEYSTORE_BASE64 (base64 of a debug.keystore file) to enable this.
      - name: Restore signing key (optional)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Using signing key from secret."
          else
            echo "No DEBUG_KEYSTORE_BASE64 secret set: a new random signing key is used for this build."
          fi

      - name: Build with Gradle
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          TASK="assemble$(echo "${VARIANT:0:1}" | tr '[:lower:]' '[:upper:]')${VARIANT:1}"
          ./gradlew clean ":app:${TASK}"

      - name: Rename APK
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/${VARIANT}/*.apk "dist/florisboard-plus-${VARIANT}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: florisboard-plus-${{ inputs.variant }}-apk
          path: dist/*.apk
